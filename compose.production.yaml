name: lore-production
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lore
      POSTGRES_DB: lore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a production database password}
    command:
      ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=50']
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lore -d lore']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redis_data:/data
    mem_limit: 96m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: lore-api:${LORE_IMAGE_TAG:?Set the built image tag}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      REDIS_URL: redis://redis:6379
      QUEUE_PREFIX: lore-production
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - '127.0.0.1:4200:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 384m
    init: true
    stop_grace_period: 30s
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  web:
    image: lore-web:${LORE_IMAGE_TAG:?Set the built image tag}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ORIGIN: https://lore.afolarin.cv
      API_INTERNAL_URL: http://api:4000
      NODE_OPTIONS: --max-old-space-size=256
    ports:
      - '127.0.0.1:3200:3000'
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 384m
    init: true
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  postgres_data:
  redis_data:
